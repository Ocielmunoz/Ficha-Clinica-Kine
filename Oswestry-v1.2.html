<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repositorio Fisio - Oswestry v1.2</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            color: #1a1a1a;
            line-height: 1.6;
            padding: 20px;
        }
        .container {
            max-width: 850px;
            margin: auto;
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            position: relative;
        }
        .version-tag {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 11px;
            font-weight: bold;
            color: #95a5a6;
            background: #f8f9fa;
            padding: 4px 8px;
            border-radius: 4px;
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 5px;
            font-size: 28px;
        }
        .subtitle {
            text-align: center;
            color: #7f8c8d;
            margin-bottom: 35px;
            font-size: 16px;
        }
        .patient-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
            background: #f8f9fa;
            padding: 25px;
            border-radius: 10px;
            border: 1px solid #e9ecef;
        }
        .input-group {
            display: flex;
            flex-direction: column;
        }
        .input-group label {
            font-weight: 600;
            margin-bottom: 8px;
            color: #34495e;
        }
        .input-group input {
            padding: 12px;
            border: 2px solid #dee2e6;
            border-radius: 6px;
            font-size: 16px;
            outline: none;
        }
        .question-block {
            margin-bottom: 30px;
            padding: 20px;
            background: #fff;
            border: 1px solid #f0f0f0;
            border-radius: 8px;
            /* Instrucción clave para el PDF y la impresión */
            page-break-inside: avoid;
            break-inside: avoid;
        }
        .question-title {
            font-weight: 700;
            margin-bottom: 15px;
            color: #2c3e50;
            border-left: 4px solid #3498db;
            padding-left: 12px;
        }
        .option-label {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
            cursor: pointer;
            padding: 8px;
            border-radius: 6px;
        }
        .option-label:hover {
            background-color: #f1f8ff;
        }
        input[type="radio"] {
            margin-right: 12px;
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        .actions {
            display: flex;
            gap: 15px;
            margin-top: 40px;
            flex-wrap: wrap;
        }
        button {
            flex: 1;
            min-width: 200px;
            padding: 16px;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            font-weight: 700;
        }
        .btn-calc { background-color: #3498db; }
        .btn-pdf { background-color: #27ae60; display: none; }
        .btn-print { background-color: #7f8c8d; display: none; }
        
        #resultado {
            margin-top: 30px;
            padding: 25px;
            background-color: #ebf5fb;
            border-radius: 8px;
            border-left: 6px solid #3498db;
            display: none;
            page-break-inside: avoid;
        }

        /* Ocultar botones e interfaz innecesaria al imprimir nativamente */
        @media print {
            body { background: white; padding: 0; }
            .container { box-shadow: none; border: none; padding: 0; }
            .actions, .version-tag { display: none !important; }
        }
    </style>
</head>
<body>

<div class="container" id="documento-area">
    <div class="version-tag">Creado por Ociel Munoz - v1.2</div>
    <h1>Índice de Discapacidad de Oswestry</h1>
    <div class="subtitle">Evaluación de la Discapacidad por Dolor Lumbar</div>
    
    <div class="patient-info">
        <div class="input-group">
            <label>Nombre y Apellido</label>
            <input type="text" id="nombrePaciente" placeholder="Nombre completo">
        </div>
        <div class="input-group">
            <label>Fecha de Evaluación</label>
            <input type="date" id="fechaEval">
        </div>
    </div>

    <div id="cuestionario-container"></div>

    <div id="resultado"></div>

    <div class="actions" id="seccion-botones">
        <button class="btn-calc" onclick="calcular()">Calcular e Interpretar</button>
        <button class="btn-pdf" id="btnDescargar" onclick="guardarPDF()">Descargar PDF</button>
        <button class="btn-print" id="btnImprimir" onclick="window.print()">Imprimir / Guardar como PDF (Nativo)</button>
    </div>
</div>

<script>
    const data = [
        { q: "1. Intensidad del Dolor", options: ["Puedo tolerar el dolor sin tener que usar analgésicos.", "El dolor es malo, pero lo tolero sin usar analgésicos.", "Los analgésicos me alivian completamente el dolor.", "Los analgésicos me alivian un poco el dolor.", "Los analgésicos apenas me alivian el dolor.", "Los analgésicos no me alivian el dolor y no los uso."] },
        { q: "2. Cuidados Personales", options: ["Me las arreglo solo normalmente sin que me aumente el dolor.", "Me las arreglo solo normalmente pero me aumenta el dolor.", "Lavarme y vestirme me produce dolor y tengo que hacerlo despacio y con cuidado.", "Necesito alguna ayuda pero me las arreglo en la mayor parte de las cosas.", "Necesito ayuda para hacer la mayor parte de las cosas.", "No puedo vestirme, me cuesta lavarme y suelo quedarme en la cama."] },
        { q: "3. Levantar Peso", options: ["Puedo levantar objetos pesados sin que me aumente el dolor.", "Puedo levantar objetos pesados pero me aumenta el dolor.", "El dolor me impide levantar objetos pesados del suelo, pero puedo hacerlo si están en un sitio cómodo.", "El dolor me impide levantar objetos pesados, pero puedo levantar objetos ligeros si están en un sitio cómodo.", "Solo puedo levantar objetos muy ligeros.", "No puedo levantar ni arrastrar ningún objeto."] },
        { q: "4. Caminar", options: ["El dolor no me impide caminar cualquier distancia.", "El dolor me impide caminar más de 1 km.", "El dolor me impide caminar más de 500 m.", "El dolor me impide caminar más de 250 m.", "Solo puedo caminar con bastón o muletas.", "Permanezco en la cama casi todo el tiempo."] },
        { q: "5. Estar Sentado", options: ["Puedo estar sentado el tiempo que quiera.", "Puedo estar sentado en mi silla favorita el tiempo que quiera.", "El dolor me impide estar sentado más de 1 hora.", "El dolor me impide estar sentado más de 30 min.", "El dolor me impide estar sentado más de 10 min.", "El dolor me impide sentarme."] },
        { q: "6. Estar de Pie", options: ["Puedo estar de pie el tiempo que quiera.", "Puedo estar de pie el tiempo que quiera pero me aumenta el dolor.", "El dolor me impide estar de pie más de 1 hora.", "El dolor me impide estar de pie más de 30 min.", "El dolor me impide estar de pie más de 10 min.", "El dolor me impide estar de pie."] },
        { q: "7. Dormir", options: ["El dolor no me impide dormir bien.", "Solo puedo dormir si tomo pastillas.", "Incluso tomando pastillas duermo menos de 6 horas.", "Incluso tomando pastillas duermo menos de 4 horas.", "Incluso tomando pastillas duermo menos de 2 horas.", "El dolor me impide totalmente dormir."] },
        { q: "8. Vida Sexual", options: ["Mi actividad sexual es normal.", "Mi actividad sexual es normal pero me aumenta el dolor.", "Mi actividad sexual es casi normal pero me aumenta mucho el dolor.", "Mi actividad sexual se ha visto muy limitada.", "Mi actividad sexual es casi nula.", "El dolor me impide cualquier actividad sexual."] },
        { q: "9. Vida Social", options: ["Mi vida social es normal y no me aumenta el dolor.", "Mi vida social es normal pero me aumenta el dolor.", "El dolor limita mis intereses más activos.", "El dolor ha limitado mi vida social y no salgo a menudo.", "El dolor ha limitado mi vida social al hogar.", "No tengo vida social."] },
        { q: "10. Viajar", options: ["Puedo viajar a cualquier sitio.", "Puedo viajar a cualquier sitio pero me aumenta el dolor.", "El dolor es malo, pero aguanto viajes de más de 2 horas.", "El dolor me limita a viajes de menos de 1 hora.", "El dolor me limita a viajes necesarios de menos de 30 min.", "El dolor me impide viajar."] }
    ];

    const container = document.getElementById('cuestionario-container');
    document.getElementById('fechaEval').valueAsDate = new Date();

    function render() {
        data.forEach((item, i) => {
            let div = document.createElement('div');
            div.className = 'question-block';
            div.innerHTML = `<div class="question-title">${item.q}</div>`;
            item.options.forEach((opt, j) => {
                div.innerHTML += `
                    <label class="option-label">
                        <input type="radio" name="q${i}" value="${j}"> ${opt}
                    </label>`;
            });
            container.appendChild(div);
        });
    }

    function calcular() {
        let score = 0, count = 0;
        data.forEach((_, i) => {
            let sel = document.querySelector(`input[name="q${i}"]:checked`);
            if (sel) { score += parseInt(sel.value); count++; }
        });

        if (count === 0) return alert("Por favor, responda al menos una categoría.");

        let percent = Math.round((score / (count * 5)) * 100);
        let text = percent <= 20 ? "Discapacidad Mínima" : percent <= 40 ? "Discapacidad Moderada" : percent <= 60 ? "Discapacidad Severa" : "Discapacidad Invalidante";

        const res = document.getElementById('resultado');
        res.style.display = "block";
        res.innerHTML = `<h3>Resultado: ${percent}%</h3><p><strong>Interpretación:</strong> ${text}</p>`;
        
        document.getElementById('btnDescargar').style.display = "block";
        document.getElementById('btnImprimir').style.display = "block";
    }

    async function guardarPDF() {
        // Hacemos scroll hacia arriba para evitar que html2canvas capture en blanco
        window.scrollTo(0, 0);

        const nombre = document.getElementById('nombrePaciente').value.trim() || "paciente";
        const fecha = document.getElementById('fechaEval').value;
        const filename = `${fecha}_${nombre.toLowerCase().replace(/\s+/g, '')}.pdf`;
        
        const element = document.getElementById('documento-area');
        const buttons = document.getElementById('seccion-botones');
        
        buttons.style.display = 'none';

        // Configuración optimizada para evitar cortes
        const opt = {
            margin: [15, 15, 15, 15], // Márgenes: arriba, izquierda, abajo, derecha
            filename: filename,
            image: { type: 'jpeg', quality: 0.98 },
            html2canvas: { 
                scale: 2, 
                scrollY: 0, 
                useCORS: true 
            },
            jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
            pagebreak: { mode: ['css', 'legacy'] } // Obliga a respetar los saltos de página del CSS
        };

        try {
            await html2pdf().set(opt).from(element).save();
        } catch (e) {
            console.error("PDF Error:", e);
            alert("Error al generar el PDF. Por favor, usa el botón 'Imprimir / Guardar como PDF (Nativo)'.");
        } finally {
            buttons.style.display = 'flex';
        }
    }

    render();
</script>

</body>
</html>
